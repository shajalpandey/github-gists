name: Github Actions DevSecOps Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "develop" ]  

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  security-events: write
  actions: read

jobs:
   security_checks:
     name: Linting and Secrets scan
     runs-on: ubuntu-latest

     steps:
       - name: Checkout code
         uses: actions/checkout@8ade135a41bc03ea155e62e844d188df1ea18608
         with:
           fetch-depth: 0 # Fetch all history for all branches and tags

       - name: Gitleaks Secret Scanning
         uses: gitleaks/gitleaks-action@8ade135a41bc03ea155e62e844d188df1ea18608
         env: 
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  

       - name: Super-Linter
         uses: github/super-linter@8ade135a41bc03ea155e62e844d188df1ea18608
         env:
           VALIDATE_ALL_CODEBASE: true
           GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}   

