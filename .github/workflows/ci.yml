name: Github Actions DevSecOps Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "develop" ]  

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  security-events: write
  actions: read

jobs:
   security_checks:
     name: Linting and Secrets scan
     runs-on: ubuntu-latest

     steps:
       - name: Checkout code
         uses: actions/checkout@v6
         with:
           fetch-depth: 0 # Fetch all history for all branches and tags

       - name: Gitleaks Secret Scanning
         uses: gitleaks/gitleaks-action@v3
         env: 
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  

      #  - name: Super-Linter
      #    uses: super-linter/super-linter@v9.0.0
      #    env:
      #      VALIDATE_ALL_CODEBASE: true
      #      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}   

       - name: Hadolint Scan
         uses: hadolint/hadolint-action@v3.1.0
         with:
           dockerfile: ./Dockerfile 

       - name: Checkov Scan
         uses: bridgecrewio/checkov-action@v12
         with:
           directory: .
           framework: dockerfile     

       - name: Trivy Scan Dockerfile
         uses: aquasecurity/trivy-action@master
         with:
           scan-type: config
           scan-ref: .
           exit-code: 1
         if: always()  # Continue even if the scan fails



   jobs:
     bandit:
      name: Scan Python code
      runs-on: ubuntu-latest

      steps:
       - name: Checkout code
         uses: actions/checkout@v4

       - name: Set up Python
         uses: actions/setup-python@v5
         with:
          python-version: "3.11"

       - name: Bandit (your Python code)
         run: |
           pip install bandit
           bandit -r . -x ./venv       