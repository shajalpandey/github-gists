

name: Github Actions DevSecOps Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "develop" ]  

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  security-events: write
  actions: read

jobs:
   security_checks:
     name: Linting and Secrets scan
     runs-on: ubuntu-latest

     steps:
       - name: Checkout code
         uses: actions/checkout@v6
         with:
           fetch-depth: 0 # Fetch all history for all branches and tags

       - name: Gitleaks Secret Scanning
         uses: gitleaks/gitleaks-action@v3
         env: 
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  

      #  - name: Super-Linter
      #    uses: super-linter/super-linter@v9.0.0
      #    env:
      #      VALIDATE_ALL_CODEBASE: true
      #      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}   

       - name: Hadolint Scan
         uses: hadolint/hadolint-action@v3.1.0
         with:
           dockerfile: ./Dockerfile 

       - name: Checkov Scan
         uses: bridgecrewio/checkov-action@v12
         with:
           directory: .
           framework: dockerfile     

       - name: Trivy Scan Dockerfile
         uses: aquasecurity/trivy-action@master
         with:
           scan-type: config
           scan-ref: .
           exit-code: 1
         if: always()  # Continue even if the scan fails



   code_scanning_bandit:
     name: Scan Python code
     runs-on: ubuntu-latest

     steps:
       - name: Checkout code
         uses: actions/checkout@v4

       - name: Set up Python
         uses: actions/setup-python@v5
         with:
          python-version: "3.11"

       - name: Bandit (your Python code)
         run: |
           pip install bandit
           bandit -r . -x ./venv --severity-level high --confidence-level high 

   code_scanning_semgrep:
     name: Semgrep scan
     runs-on: ubuntu-latest
     container:
       image: semgrep/semgrep
     steps:
       - name: Checkout code
         uses: actions/checkout@v4

       - name: Run Semgrep
         run: semgrep scan --config p/python --config p/flask --severity ERROR --error --exclude-rule python.flask.security.injection.ssrf-requests.ssrf-requests .     

   sca_scan_checks:
     name: SCA Scan and Auto Remediation
     needs: [security_checks, code_scanning_bandit, code_scanning_semgrep]
     runs-on: ubuntu-latest
     steps:
     - name: Checkout code
       uses: actions/checkout@v4

     - name: Run Trivy SCA Scan
       uses: aquasecurity/trivy-action@v0.36.0
       with:
         scan-type: fs
         scan-ref: .
         format: sarif
         scanners: vuln
         severity: CRITICAL,HIGH
         output: trivy-sca-results.sarif
        #  exit-code: 1

     - name: Upload Trivy SCA Scan Results
       if: always()  # Continue even if the scan fails 
       uses: github/codeql-action/upload-sarif@v4
       with:
         sarif_file: trivy-sca-results.sarif
         category: trivy-sca-results

     - name: Auto-Patch Vulnerabilities
       id: auto_patch
       run: |
          if [ -f requirements.txt ]; then
            echo "Found the python libraries requirements.txt file. Running pip-audit to check for vulnerabilities and auto-patch..."
            pip install pip-audit
            pip-audit --requirement requirements.txt --fix 
            pip install -r requirements.txt && pytest || exit 1
          fi

     - name: Commit and Push Changes
       uses: stefanzweifel/git-auto-commit-action@v7
       with: 
         commit_message: "Push auto-patched vulnerabilities"
         file_pattern: "requirements.txt"

   deploy_main:
      name: Deploy Application
      runs-on: ubuntu-latest
      needs: sca_scan_checks
      steps:
        - name: Checkout code
          uses: actions/checkout@v4

        - name: Create short sha for tagging 
          id: vars
          run: echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

        - name: Google Cloud Authentication
          uses: 'google-github-actions/auth@v3'
          with:
            credentials_json: ${{ secrets.SA_KEY }}

        - name: 'Set up Cloud SDK'
          uses: 'google-github-actions/setup-gcloud@v3'
          with:
            version: '>= 363.0.0'

        - name: Build Docker Image
          run: |
              gcloud auth configure-docker asia-south1-docker.pkg.dev
              docker build -t github-gists:${{ steps.vars.outputs.SHORT_SHA }} .

        - name: Scan Docker Image
          uses: aquasecurity/trivy-action@v0.36.0
          with:
            image-ref: 'github-gists:${{ steps.vars.outputs.SHORT_SHA }}'
            format: 'table'
            exit-code: '1'
            ignore-unfixed: true
            vuln-type: 'os,library'
            severity: 'CRITICAL,HIGH'     

        - name: Push Docker Image to GAR
          
          run: |
              docker tag github-gists:${{ steps.vars.outputs.SHORT_SHA }} asia-south1-docker.pkg.dev/virtual-limiter-237820/vulntracker/github-gists:${{ steps.vars.outputs.SHORT_SHA }}
              docker push asia-south1-docker.pkg.dev/virtual-limiter-237820/vulntracker/github-gists:${{ steps.vars.outputs.SHORT_SHA }}
